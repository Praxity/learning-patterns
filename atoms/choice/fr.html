<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option de réponse et marque de résultat</title>
<link rel="stylesheet" href="../../lib/base.css">
<style>body { max-inline-size: 52rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<main>
<h1>Option de réponse et marque de résultat</h1>
<h2>Avant la vérification</h2>
<section class="lp" lang="fr" data-lp-atom="choice">
  <fieldset class="lp-choices" id="before-question">
    <legend class="lp-stem">À quoi sert un fonds d’urgence ?</legend>
    <div class="lp-choices">
      <label class="lp-choice" for="before-option-0"><input type="radio" id="before-option-0" name="before-question" value="costs"><span>Aux dépenses imprévues, comme une réparation d’auto</span></label>
      <label class="lp-choice" for="before-option-1"><input type="radio" id="before-option-1" name="before-question" value="holiday"><span>À un voyage prévu pour l’an prochain</span></label>
      <label class="lp-choice" for="before-option-2"><input type="radio" id="before-option-2" name="before-question" value="shares"><span>À acheter des actions quand les prix baissent</span></label>
    </div>
  </fieldset>
</section>
<h2>Après la vérification</h2>
<section class="lp" lang="fr" data-lp-atom="choice">
  <fieldset class="lp-choices" id="after-question">
    <legend class="lp-stem">À quoi sert un fonds d’urgence ?</legend>
    <div class="lp-choices">
      <label class="lp-choice" for="after-option-0" data-lp-mark="missed"><input type="radio" id="after-option-0" name="after-question" value="costs" disabled><span>Aux dépenses imprévues, comme une réparation d’auto</span><span class="lp-choice-mark lp-neutral"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lp-icon" aria-hidden="true" focusable="false" > <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M8.56 3.69a9 9 0 0 0 -2.92 1.95" /> <path d="M3.69 8.56a9 9 0 0 0 -.69 3.44" /> <path d="M3.69 15.44a9 9 0 0 0 1.95 2.92" /> <path d="M8.56 20.31a9 9 0 0 0 3.44 .69" /> <path d="M15.44 20.31a9 9 0 0 0 2.92 -1.95" /> <path d="M20.31 15.44a9 9 0 0 0 .69 -3.44" /> <path d="M20.31 8.56a9 9 0 0 0 -1.95 -2.92" /> <path d="M15.44 3.69a9 9 0 0 0 -3.44 -.69" /> </svg><span>Bonne réponse</span></span></label>
      <label class="lp-choice" for="after-option-1" data-lp-mark="wrong"><input type="radio" id="after-option-1" name="after-question" value="holiday" checked disabled><span>À un voyage prévu pour l’an prochain</span><span class="lp-choice-mark lp-missed"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lp-icon" aria-hidden="true" focusable="false" > <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M18 6l-12 12" /> <path d="M6 6l12 12" /> </svg><span>Incorrect</span></span></label>
      <label class="lp-choice" for="after-option-2"><input type="radio" id="after-option-2" name="after-question" value="shares" disabled><span>À acheter des actions quand les prix baissent</span></label>
    </div>
  </fieldset>
  <p>Un voyage prévu est un objectif d’épargne. Un fonds d’urgence couvre les dépenses qu’on ne peut pas prévoir.</p>
</section>
</main>
</body>
</html>
