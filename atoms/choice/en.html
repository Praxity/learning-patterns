<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choice option and answer mark</title>
<link rel="stylesheet" href="../../lib/base.css">
<link rel="stylesheet" href="atom.css">
<style>body { max-inline-size: 52rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<main>
<h1>Choice option and answer mark</h1>
<h2>Before checking</h2>
<section class="lp" lang="en" data-lp-atom="choice">
  <fieldset class="lp-choices" id="before-question">
    <legend class="lp-stem lp-choice-legend">What is an emergency fund for?</legend>
    <label class="lp-choice" for="before-option-0"><input type="radio" id="before-option-0" name="before-question" value="costs"><span>Costs you can't plan for, such as a car repair</span></label>
    <label class="lp-choice" for="before-option-1"><input type="radio" id="before-option-1" name="before-question" value="holiday"><span>A holiday you are planning for next year</span></label>
    <label class="lp-choice" for="before-option-2"><input type="radio" id="before-option-2" name="before-question" value="shares"><span>Buying shares when prices drop</span></label>
  </fieldset>
</section>
<h2>After checking</h2>
<section class="lp" lang="en" data-lp-atom="choice">
  <fieldset class="lp-choices" id="after-question">
    <legend class="lp-stem lp-choice-legend">What is an emergency fund for?</legend>
    <label class="lp-choice" for="after-option-0" data-lp-mark="missed"><input type="radio" id="after-option-0" name="after-question" value="costs" disabled><span>Costs you can't plan for, such as a car repair</span><span class="lp-choice-mark lp-neutral"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lp-icon" aria-hidden="true" focusable="false" > <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M8.56 3.69a9 9 0 0 0 -2.92 1.95" /> <path d="M3.69 8.56a9 9 0 0 0 -.69 3.44" /> <path d="M3.69 15.44a9 9 0 0 0 1.95 2.92" /> <path d="M8.56 20.31a9 9 0 0 0 3.44 .69" /> <path d="M15.44 20.31a9 9 0 0 0 2.92 -1.95" /> <path d="M20.31 15.44a9 9 0 0 0 .69 -3.44" /> <path d="M20.31 8.56a9 9 0 0 0 -1.95 -2.92" /> <path d="M15.44 3.69a9 9 0 0 0 -3.44 -.69" /> </svg><span>Correct answer</span></span></label>
    <label class="lp-choice" for="after-option-1" data-lp-mark="wrong"><input type="radio" id="after-option-1" name="after-question" value="holiday" checked disabled><span>A holiday you are planning for next year</span><span class="lp-choice-mark lp-missed"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lp-icon" aria-hidden="true" focusable="false" > <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M18 6l-12 12" /> <path d="M6 6l12 12" /> </svg><span>Incorrect</span></span></label>
    <label class="lp-choice" for="after-option-2"><input type="radio" id="after-option-2" name="after-question" value="shares" disabled><span>Buying shares when prices drop</span></label>
    <p>A holiday you plan for is a savings goal. An emergency fund covers costs you can't plan for.</p>
  </fieldset>
</section>
</main>
</body>
</html>
