<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutons et rangée d’actions</title>
<link rel="stylesheet" href="../../lib/base.css">
<style>body { max-inline-size: 52rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<main>
<h1>Boutons et rangée d’actions</h1>
<h2>Avant la vérification</h2>
<section class="lp" lang="fr" data-lp-atom="buttons">
  <div class="lp-actions">
    <button class="lp-button" type="button">Vérifier ma réponse</button>
    <button class="lp-button lp-button-secondary" type="button">Afficher un indice</button>
  </div>
</section>
<h2>Après la vérification</h2>
<section class="lp" lang="fr" data-lp-atom="buttons">
  <div class="lp-actions">
    <button class="lp-button lp-button-quiet" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lp-icon" aria-hidden="true" focusable="false" > <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" /> <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" /> </svg>Réessayer</button>
  </div>
</section>
</main>
</body>
</html>
