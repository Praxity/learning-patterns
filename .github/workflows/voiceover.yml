name: VoiceOver evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/voiceover.yml'
      - 'playwright.voiceover.config.js'
      - 'tests/voiceover/**'
permissions:
  contents: read
concurrency:
  group: voiceover-${{ github.ref }}
  cancel-in-progress: true
jobs:
  voiceover:
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Record runner before setup
        run: |
          mkdir -p test-results/voiceover-environment
          sw_vers > test-results/voiceover-environment/runner.txt
          echo "Runner image: $ImageOS $ImageVersion" >> test-results/voiceover-environment/runner.txt
          say -v '?' > test-results/voiceover-environment/voices.txt
      # VoiceOver moves the pointer; a hot corner opened Quick Note mid-journey in run 37843643548.
      - name: Disable hot corners
        run: |
          for corner in tl tr bl br; do defaults write com.apple.dock "wvous-$corner-corner" -int 0; done
          killall Dock
      # Setup recording stalled on this image; speech capture does not need ffmpeg.
      - name: Configure Guidepup
        timeout-minutes: 5
        shell: bash
        run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.1 setup --ci 2>&1 | tee test-results/voiceover-environment/setup.log
      - run: npm ci --no-audit --no-fund --no-progress
      - run: npx playwright install webkit
      - name: Install Guidepup assets
        timeout-minutes: 5
        shell: bash
        run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.1 install 2>&1 | tee test-results/voiceover-environment/install.log
      - name: Record environment
        run: |
          mkdir -p test-results/voiceover-environment
          {
            sw_vers
            echo "Runner image: $ImageOS $ImageVersion"
            node --version
            npm --version
            npx playwright --version
            npm ls @guidepup/guidepup
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /System/Library/CoreServices/VoiceOver.app/Contents/Info.plist
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /System/Library/CoreServices/VoiceOver.app/Contents/Info.plist
          } > test-results/voiceover-environment/versions.txt
          say -v '?' > test-results/voiceover-environment/voices.txt
      - run: npm run demo
      - name: Positive control, required before journeys
        run: npm run test:voiceover -- --grep 'positive control'
        env:
          VO_PHASE: control
      - name: Record the eight patterns in English and French
        run: npm run test:voiceover -- --grep-invert 'positive control'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voiceover-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
